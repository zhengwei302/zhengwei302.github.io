<!-- 引入 Mapbox 和 Deck.gl 的 CDN 依赖 -->
<script src="https://unpkg.com/deck.gl@latest/dist.min.js"></script>
<script src="https://api.tiles.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js"></script>
<link href="https://api.tiles.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css" rel="stylesheet" />

<!-- 设置地图容器的样式 -->
<style>
  #map-container {
    width: 100%;
    height: 500px; /* 你可以根据需要调整地图高度 */
    position: relative;
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 20px;
  }
</style>

<!-- 地图容器 -->
<div id="map-container"></div>

<script>
  // 1. 填入你刚刚申请的 Mapbox Token
  const MAPBOX_ACCESS_TOKEN = '填入你的_MAPBOX_TOKEN_保留单引号';

  // 2. 准备你的飞线数据 (起点 -> 新加坡)
  const data = [
    { sourcePosition: [116.4, 39.9], targetPosition: [103.8, 1.3], color: [255, 200, 0] }, // 北京 -> 新加坡
    { sourcePosition: [-122.4, 37.7], targetPosition: [103.8, 1.3], color: [0, 200, 255] } // 旧金山 -> 新加坡
    // 在这里继续添加你的团队成员数据...
  ];

  // 3. 初始化 Mapbox 底图
  const map = new mapboxgl.Map({
    container: 'map-container',
    style: 'mapbox://styles/mapbox/dark-v11', // 暗黑主题
    center: [103.8, 1.3], // 视角中心点（新加坡）
    zoom: 1.5,
    pitch: 30, // 带有一定倾斜角，凸显 3D 飞线
    accessToken: MAPBOX_ACCESS_TOKEN,
    interactive: true // 允许鼠标拖拽缩放
  });

  // 4. 等待底图加载完毕后，叠加 Deck.gl 的飞线图层
  map.on('load', () => {
    const deckOverlay = new deck.MapboxOverlay({
      layers: [
        new deck.ArcLayer({
          id: 'arcs',
          data: data,
          getSourcePosition: d => d.sourcePosition,
          getTargetPosition: d => d.targetPosition,
          getSourceColor: d => d.color,
          getTargetColor: d => d.color,
          getWidth: 3,
          getHeight: 0.5 // 弧线高度
        })
      ]
    });
    map.addControl(deckOverlay);
  });
</script>
