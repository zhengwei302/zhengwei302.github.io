</style> <div id="footprints-map-container"> <div id="tooltip" class="map-tooltip"></div> </div> <script>
  // 1. Color Palette (RGB)
  const COLOR_EDUCATION = 'rgb(0, 225, 255)';   // Cyan Blue
  const COLOR_WORK      = 'rgb(255, 170, 0)';   // Amber Gold
  const COLOR_FLIGHT    = 'rgb(236, 72, 153)';  // Pink
  const COLOR_DRIVE     = 'rgb(34, 197, 94)';   // Emerald Green

  // 2. City Coordinates (Latitude, Longitude for Leaflet)
  const CITIES = {
    "Urumqi": [43.7928, 87.6177],
    "Beijing": [39.9042, 116.4074],
    "Guangzhou": [23.1291, 113.2644],
    "Hong Kong": [22.3193, 114.1694],
    "Chicago": [41.8781, -87.6298],
    "Shenzhen": [22.5431, 114.0579],
    "South Korea": [36.3504, 127.3845],
    "Shenyang": [41.8057, 123.4315],
    "Dalian": [38.9140, 121.6147],
    "Yinchuan": [38.4664, 106.2781],
    "Xi'an": [34.3416, 108.9398],
    "Shanghai": [31.2304, 121.4737],
    "Hangzhou": [30.2741, 120.1551],
    "Nanjing": [32.0603, 118.7969],
    "Wuhan": [30.5928, 114.3055],
    "Changsha": [28.2282, 112.9388],
    "Chongqing": [29.5630, 106.5516],
    "Chengdu": [30.5728, 104.0668],
    "Haikou": [20.0311, 110.3312],
    "Sanya": [18.2528, 109.5119],
    "Xiamen": [24.4798, 118.0894],
    "Wenzhou": [28.0006, 120.6994],
    "Zhuhai": [22.2707, 113.5767],
    "Prague": [50.0755, 14.4378],
    "Paris": [48.8566, 2.3522],
    "Amsterdam": [52.3676, 4.9041],
    "London": [51.5074, -0.1276],
    "Dubai": [25.2048, 55.2708],
    "Kuala Lumpur": [3.1390, 101.6869],
    "Seoul": [37.5665, 126.9780],
    "Tokyo": [35.6895, 139.6917],
    "Osaka": [34.6937, 135.5023],
    "Vienna": [48.2082, 16.3738],
    "Taipei": [25.0330, 121.5654],
    "Los Angeles": [34.0522, -118.2437],
    "Bangkok": [13.7563, 100.5018],
    "Bali": [-8.4095, 115.1889],
    "Singapore": [1.3521, 103.8198],
    "Sydney": [-33.8688, 151.2093],
    "Jakarta": [-6.2088, 106.8456],
    "Helsinki": [60.1699, 24.9384],
    "Cebu": [10.3157, 123.8854],
    "Morocco": [34.0209, -6.8498],
    "Asahikawa": [43.7706, 142.3648],
    "Sapporo": [43.0618, 141.3545],
    "Surabaya": [-7.2575, 112.7521],
    "Sandakan": [5.8394, 118.1174],
    "Switzerland": [46.9480, 7.4474],
    "Inverness": [57.4778, -4.2247],
    "Nice": [43.7102, 7.2620],
    "Rome": [41.9028, 12.4964],
    "Barcelona": [41.3851, 2.1734]
  };

  // 3. Routes Definition
  const educationRoutes = [["Urumqi", "Beijing"], ["Beijing", "Guangzhou"], ["Guangzhou", "Hong Kong"], ["Hong Kong", "Chicago"]];
  const workRoutes = [["Beijing", "Shenzhen"], ["Shenzhen", "Guangzhou"], ["Guangzhou", "Hong Kong"], ["Hong Kong", "South Korea"]];
  const flightRoutes = [
    ["Beijing", "Urumqi"], ["Beijing", "Shenyang"], ["Beijing", "Dalian"], ["Beijing", "Yinchuan"],
    ["Beijing", "Xi'an"], ["Beijing", "Shanghai"], ["Beijing", "Hangzhou"], ["Beijing", "Nanjing"],
    ["Beijing", "Wuhan"], ["Beijing", "Changsha"], ["Beijing", "Chongqing"], ["Beijing", "Chengdu"],
    ["Beijing", "Guangzhou"], ["Beijing", "Shenzhen"], ["Beijing", "Haikou"], ["Beijing", "Sanya"],
    ["Beijing", "Xiamen"], ["Beijing", "Wenzhou"], ["Beijing", "Zhuhai"], ["Beijing", "Prague"],
    ["Beijing", "Paris"], ["Beijing", "Amsterdam"], ["Beijing", "London"], ["Beijing", "Dubai"],
    ["Beijing", "Kuala Lumpur"], ["Beijing", "Seoul"], ["Beijing", "Tokyo"], ["Beijing", "Osaka"],
    ["Beijing", "Vienna"], ["Guangzhou", "Urumqi"], ["Guangzhou", "Taipei"], ["Guangzhou", "Hong Kong"],
    ["Guangzhou", "Los Angeles"], ["Guangzhou", "Bangkok"], ["Guangzhou", "Seoul"], ["Guangzhou", "Kuala Lumpur"],
    ["Guangzhou", "Bali"], ["Guangzhou", "Singapore"], ["Guangzhou", "Sydney"], ["Guangzhou", "Jakarta"],
    ["Hong Kong", "Seoul"], ["Hong Kong", "Los Angeles"], ["Hong Kong", "Helsinki"], ["Hong Kong", "Cebu"],
    ["Dubai", "Morocco"], ["Asahikawa", "Tokyo"], ["Sapporo", "Shenzhen"], ["Bali", "Surabaya"],
    ["Kuala Lumpur", "Sandakan"], ["Helsinki", "Switzerland"], ["Switzerland", "Paris"], ["London", "Inverness"],
    ["Paris", "Nice"], ["Nice", "Rome"], ["Rome", "Barcelona"], ["Barcelona", "Paris"]
  ];
  const driveRoutes = [];

  function buildArcs(routes, color, category) {
    return routes.map(([from, to]) => ({
      from, to, category, color,
      start: CITIES[from], end: CITIES[to]
    })).filter(d => d.start && d.end);
  }

  const allArcs = [
    ...buildArcs(educationRoutes, COLOR_EDUCATION, "Education"),
    ...buildArcs(workRoutes, COLOR_WORK, "Work / Research"),
    ...buildArcs(flightRoutes, COLOR_FLIGHT, "Flight Travel"),
    ...buildArcs(driveRoutes, COLOR_DRIVE, "Road Trip")
  ];

  const cityMap = new Map();
  allArcs.forEach(arc => {
    if (!cityMap.has(arc.from)) cityMap.set(arc.from, { name: arc.from, coords: arc.start, color: arc.color });
    if (!cityMap.has(arc.to)) cityMap.set(arc.to, { name: arc.to, coords: arc.end, color: arc.color });
  });
  const allPlaces = Array.from(cityMap.values());

  // 4. Initialize Leaflet
  const map = L.map('footprints-map-container', {
    center: [25, 40],
    zoom: 2,
    zoomControl: true
  });

  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    subdomains: 'abcd',
    maxZoom: 19
  }).addTo(map);

  // 5. Canvas Overlay Layer
  const container = document.getElementById('footprints-map-container');
  const canvas = document.createElement('canvas');
  canvas.className = 'footprint-overlay';
  container.appendChild(canvas);
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    canvas.width = container.clientWidth;
    canvas.height = container.clientHeight;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw Arc Lines
    allArcs.forEach(arc => {
      const p1 = map.latLngToContainerPoint(arc.start);
      const p2 = map.latLngToContainerPoint(arc.end);

      // Midpoint & Curve Control Point
      const midX = (p1.x + p2.x) / 2;
      const midY = (p1.y + p2.y) / 2;
      const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
      const ctrlX = midX;
      const ctrlY = midY - Math.min(dist * 0.25, 120);

      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.quadraticCurveTo(ctrlX, ctrlY, p2.x, p2.y);
      ctx.strokeStyle = arc.color;
      ctx.lineWidth = 1.5;
      ctx.globalAlpha = 0.6;
      ctx.stroke();
    });

    // Draw City Nodes
    allPlaces.forEach(place => {
      const p = map.latLngToContainerPoint(place.coords);
      
      // Outer Glow
      ctx.beginPath();
      ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
      ctx.fillStyle = place.color;
      ctx.globalAlpha = 0.3;
      ctx.fill();

      // Inner Core
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.globalAlpha = 0.9;
      ctx.fill();
    });
  }

  map.on('move', draw);
  map.on('zoom', draw);
  draw();

  // Hover Interaction
  const tooltip = document.getElementById('tooltip');
  canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;

    let hovered = null;
    for (const place of allPlaces) {
      const p = map.latLngToContainerPoint(place.coords);
      if (Math.hypot(p.x - mouseX, p.y - mouseY) < 8) {
        hovered = place.name;
        break;
      }
    }

    if (hovered) {
      tooltip.style.display = 'block';
      tooltip.style.left = `${mouseX + 12}px`;
      tooltip.style.top = `${mouseY + 12}px`;
      tooltip.innerHTML = `<strong>${hovered}</strong>`;
    } else {
      tooltip.style.display = 'none';
    }
  });
